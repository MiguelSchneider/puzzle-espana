<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>España, pieza a pieza</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puzle España">
<meta name="theme-color" content="#E3E9EF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E3E9EF;        /* sea */
  --panel:#F6F8FA;
  --land:#FBFBF9;      /* empty map silhouette */
  --ink:#1D2730;
  --muted:#5E6B78;
  --line:#B9C5D0;
  --coast:#7C8FA3;
  --accent:#0F6E7A;
  --accent-ink:#FFFFFF;
  --good:#1E9E62;
  --warn:#D98A1B;
  --piece-l:64%; --piece-s:50%; --border:rgba(25,40,55,.55); --border-strong:rgba(25,40,55,.85);
  --shadow:0 2px 8px rgba(20,40,60,.18);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141A21;--panel:#1D252E;--land:#28323D;--ink:#EDF1F5;--muted:#9AA8B6;
    --line:#3C4855;--coast:#6E7F91;--accent:#4FB7C4;--accent-ink:#0E1A1E;
    --good:#3FC57F;--warn:#F0A73A;--piece-l:52%;--piece-s:48%;--border:rgba(0,0,0,.6);--border-strong:rgba(0,0,0,.9);--shadow:0 2px 10px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#141A21;--panel:#1D252E;--land:#28323D;--ink:#EDF1F5;--muted:#9AA8B6;
  --line:#3C4855;--coast:#6E7F91;--accent:#4FB7C4;--accent-ink:#0E1A1E;
  --good:#3FC57F;--warn:#F0A73A;--piece-l:52%;--piece-s:48%;--border:rgba(0,0,0,.6);--border-strong:rgba(0,0,0,.9);--shadow:0 2px 10px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:"Fredoka","Avenir Next","Segoe UI",system-ui,sans-serif;font-size:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);
  border-bottom:1px solid var(--line)}
h1{font-size:1.15rem;font-weight:600;margin:0 6px 0 0;letter-spacing:.01em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 14px;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
button:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.stats{display:flex;gap:16px;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.stats b{color:var(--ink);font-weight:600}
main{flex:1;min-height:0;position:relative;touch-action:none}
svg#board{width:100%;height:100%;display:block}
.status{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px;box-shadow:var(--shadow);
  max-width:min(92vw,560px);text-align:center;pointer-events:none;transition:opacity .2s}
.status .big{font-size:1.35rem;font-weight:600;line-height:1.2}
.status .sub{color:var(--muted);font-size:.95rem;margin-top:2px}
.status.good{border-color:var(--good)}
.status.warn{border-color:var(--warn)}
.status.empty{opacity:0}

/* map layers */
.silhouette{fill:var(--land);stroke:var(--coast);stroke-width:1.2;stroke-linejoin:round}
.inset{fill:none;stroke:var(--coast);stroke-width:1;stroke-dasharray:4 4}
.ghost{fill:none;stroke:var(--border);stroke-width:.9;stroke-linejoin:round}
.ghost.community{stroke:var(--border-strong);stroke-width:1.8}
.tint{fill:hsl(var(--h) var(--s) calc(var(--piece-l) + var(--dl)));fill-opacity:.55;stroke:none}

.piece{cursor:grab;transition:transform .18s ease}
.piece.dragging{cursor:grabbing;transition:none}
.piece path{fill:hsl(var(--h) var(--s) calc(var(--piece-l) + var(--dl)));stroke:rgba(20,30,40,.55);stroke-width:.9;stroke-linejoin:round;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.piece.dragging path{filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.piece .grip{fill:hsl(var(--h) var(--s) calc(var(--piece-l) + var(--dl)));fill-opacity:.3;stroke:hsl(var(--h) var(--s) 40%);stroke-width:1.2;stroke-dasharray:3 3}
.piece.locked{cursor:default;pointer-events:none}
.piece.locked path{stroke:#fff;stroke-width:.8;filter:none;fill:hsl(var(--h) var(--s) calc(var(--piece-l) + var(--dl)))}
.piece.locked .grip{display:none}
.piece.miss{animation:shake .35s}
@keyframes shake{0%,100%{translate:0}25%{translate:-5px 0}75%{translate:5px 0}}
.ring{fill:none;stroke:var(--good);stroke-width:3;opacity:0;pointer-events:none}
.warm{fill:var(--good);fill-opacity:.15;stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
.ghost.marker{stroke-dasharray:3 3;stroke-width:1.2}
.ring.go{animation:ring .55s ease-out}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.5)}}
.lbl{font-family:inherit;font-weight:500;fill:#1D2730;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:2.5px;stroke-linejoin:round}
.lbl.tiny{font-size:8px}
.done{position:absolute;inset:0;display:none;place-items:center;background:rgba(10,20,30,.35)}
.done.show{display:grid}
.card{background:var(--panel);color:var(--ink);border-radius:18px;padding:24px 28px;box-shadow:var(--shadow);max-width:360px;text-align:center}
.card h2{margin:0 0 6px;font-size:1.5rem;font-weight:600}
.card p{margin:4px 0 16px;color:var(--muted)}
.card .btn{margin:4px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (prefers-reduced-motion:reduce){.piece,.status{transition:none}.piece.miss,.ring.go{animation:none}}
@media (max-width:640px){header{padding:8px 10px;gap:8px}h1{font-size:1rem;width:100%}.stats{gap:10px;font-size:.9rem}.btn,.seg button{padding:5px 11px;font-size:.9rem}}
</style>
</head>
<body>
<header>
  <h1>España, pieza a pieza</h1>
  <div class="seg" role="group" aria-label="Tipo de piezas">
    <button id="modeP" aria-pressed="true">Provincias</button>
    <button id="modeC" aria-pressed="false">Comunidades</button>
  </div>
  <button class="btn" id="hint">Pista: bordes de comunidades</button>
  <button class="btn" id="shuffle">Barajar</button>
  <button class="btn" id="full" hidden>Pantalla completa</button>
  <span class="spacer"></span>
  <div class="stats"><span><b id="placed">0</b>/<span id="total">52</span> colocadas</span><span><b id="time">0:00</b></span></div>
</header>
<main>
  <svg id="board" xmlns="http://www.w3.org/2000/svg">
    <g id="map">
      <path id="silhouette" class="silhouette"/>
      <path id="inset" class="inset"/>
      <g id="ghosts"></g>
    </g>
    <g id="locked"></g>
    <g id="labels"></g>
    <g id="loose"></g>
    <g id="fx"></g>
  </svg>
  <div class="status empty" id="status"><div class="big" id="sBig"></div><div class="sub" id="sSub"></div></div>
  <div class="done" id="done"><div class="card"><h2 id="dTitle">Mapa completo</h2><p id="dText"></p>
    <button class="btn primary" id="again">Jugar otra vez</button><button class="btn" id="switch">Probar comunidades</button></div></div>
</main>

<script>
(() => {
const svg = document.getElementById('board');
const $ = id => document.getElementById(id);
const SHORT = {"Principado de Asturias":"Asturias","Comunidad Foral de Navarra":"Navarra","Comunidad de Madrid":"Madrid",
  "Región de Murcia":"Murcia","Ciudad Autónoma de Ceuta":"Ceuta","Ciudad Autónoma de Melilla":"Melilla",
  "País Vasco/Euskadi":"País Vasco","Cataluña/Catalunya":"Cataluña","Comunitat Valenciana":"C. Valenciana",
  "Illes Balears":"Baleares","Castilla-La Mancha":"Castilla-La Mancha","Castilla y León":"Castilla y León"};
const short = n => SHORT[n] || n;
// Hand-picked so neighbouring communities never share a hue family: [hue, saturation %, lightness offset %].
// Order matches DATA.regions.
const PALETTE = [
  [165, 55, 0],   // Galicia        teal-green
  [0,   70, 4],   // Asturias       red
  [235, 65, 6],   // Cantabria      blue
  [95,  55, -2],  // País Vasco     lime green
  [335, 65, 4],   // Navarra        pink-red
  [300, 50, 6],   // La Rioja       magenta
  [190, 65, -4],  // Aragón         cyan
  [55,  85, -2],  // Cataluña       yellow
  [38,  80, 2],   // Castilla y León golden
  [255, 60, 8],   // Madrid         violet
  [130, 55, -4],  // Castilla-La Mancha green
  [280, 55, 6],   // C. Valenciana  purple
  [15,  85, 6],   // Illes Balears  coral
  [325, 55, 8],   // Extremadura    rose
  [210, 70, 2],   // Andalucía      azure
  [28,  90, 0],   // Murcia         orange
  [45,  70, 8],   // Canarias       sand
  [0,   60, 8],   // Ceuta
  [120, 50, 0],   // Melilla
];
const paint = (node, ri) => { const [h, sat, dl] = PALETTE[ri] || [0, 0, 0]; node.style.setProperty('--h', h); node.style.setProperty('--s', sat + '%'); node.style.setProperty('--dl', dl + '%'); };
const HINTS = ['Pista: solo la silueta', 'Pista: bordes de comunidades', 'Pista: todos los bordes', 'Pista: comunidades coloreadas'];
const W = DATA.W, H = DATA.H;
const TRAY_SCALE = 0.6;

let mode = 'provinces', hintLevel = 1, pieces = [], placed = 0, misses = 0, t0 = null, timer = null, VB = null, done = false;
try { mode = localStorage.getItem('spp.mode') || mode; hintLevel = +(localStorage.getItem('spp.hint') ?? hintLevel); } catch (e) {}
if (!['provinces','communities'].includes(mode)) mode = 'provinces';
if (!(hintLevel >= 0 && hintLevel <= 3)) hintLevel = 1;

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs = {}) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const rand = (a, b) => a + Math.random() * (b - a);
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function layout() {
  // Portrait viewports put the tray below the map; landscape ones put it on both sides.
  const r = svg.getBoundingClientRect();
  const portrait = r.width / Math.max(r.height, 1) < 1.05;
  let vb, zones;
  if (portrait) {
    vb = { x: 0, y: 0, w: W, h: H + 460 };
    zones = [{ x: 20, y: H + 20, w: W - 40, h: 340 }];
  } else {
    const side = 360;
    vb = { x: -side, y: -10, w: W + side * 2, h: H + 20 };
    zones = [{ x: -side + 15, y: 10, w: side - 40, h: H - 20 }, { x: W + 25, y: 10, w: side - 40, h: H - 20 }];
  }
  VB = { ...vb, zones, portrait };
  svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
}

function setTransform(p, animate = true) {
  // transform = translate(tx,ty) scale(s) about the piece centroid
  const [cx, cy] = p.c, s = p.s;
  p.g.style.transform = `translate(${p.tx + cx - s * cx}px, ${p.ty + cy - s * cy}px) scale(${s})`;
  // Labels keep a readable on-screen size whatever the piece scale.
  p.lbl.setAttribute('font-size', (p.locked ? p.lockedSize : 11) / s);
}

function build() {
  const src = mode === 'provinces' ? DATA.provinces : DATA.communities;
  $('loose').replaceChildren(); $('locked').replaceChildren(); $('labels').replaceChildren(); $('fx').replaceChildren();
  pieces = src.map((d, i) => {
    const g = el('g', { class: 'piece', tabindex: '-1' });
    paint(g, d.ri);
    const path = el('path', { d: d.d });
    g.appendChild(path);
    const bw = d.bbox[1][0] - d.bbox[0][0], bh = d.bbox[1][1] - d.bbox[0][1];
    const minDim = Math.min(bw, bh);
    const tiny = minDim < 14;
    if (tiny) g.appendChild(el('circle', { class: 'grip', cx: d.c[0], cy: d.c[1], r: 26 }));
    const lbl = el('text', { class: 'lbl', x: d.c[0], y: tiny ? d.c[1] - 30 : d.c[1] + 3 });
    lbl.textContent = mode === 'provinces' ? d.name.split('/')[0] : short(d.name);
    g.appendChild(lbl);
    const tol = tiny ? 34 : Math.min(30, Math.max(12, minDim * 0.22));
    const fits = bw > 36 && bh > 20;
    const p = { ...d, i, g, lbl, tx: 0, ty: 0, s: tiny ? 1 : TRAY_SCALE, locked: false, tol, bw, bh, tiny, lockedSize: fits ? Math.min(11, Math.max(8, bw / 7)) : 8 };
    g.addEventListener('pointerdown', e => onDown(e, p));
    g.addEventListener('pointerenter', () => { if (!drag && !p.locked) say(p.name, mode === 'provinces' ? short(p.region) : '', ''); });
    return p;
  });
  $('total').textContent = pieces.length;
  drawHints();
  scatter();
  placed = 0; misses = 0; done = false; $('placed').textContent = 0;
  stopTimer(); $('time').textContent = '0:00';
  $('done').classList.remove('show');
  say(mode === 'provinces' ? 'Arrastra una provincia al mapa' : 'Arrastra una comunidad al mapa', 'Encaja sola cuando la posición es correcta', '');
}

function scatter() {
  layout();
  const order = shuffleArr(pieces.filter(p => !p.locked));
  const n = order.length;
  const totalArea = VB.zones.reduce((a, z) => a + z.w * z.h, 0);
  let k = 0;
  VB.zones.forEach(z => {
    const count = Math.round(n * (z.w * z.h) / totalArea);
    const items = order.slice(k, k + count); k += count;
    const cols = Math.max(1, Math.round(Math.sqrt(items.length * z.w / z.h)));
    const rows = Math.max(1, Math.ceil(items.length / cols));
    const cw = z.w / cols, ch = z.h / rows;
    items.forEach((p, j) => {
      const col = j % cols, row = Math.floor(j / cols);
      const x = z.x + cw * (col + 0.5) + rand(-cw * 0.15, cw * 0.15);
      const y = z.y + ch * (row + 0.5) + rand(-ch * 0.15, ch * 0.15);
      p.tx = x - p.c[0]; p.ty = y - p.c[1]; p.s = p.tiny ? 1 : TRAY_SCALE;
      p.g.style.transition = 'none'; setTransform(p); $('loose').appendChild(p.g);
      requestAnimationFrame(() => p.g.style.transition = '');
    });
  });
  // leftovers from rounding
  order.slice(k).forEach(p => { const z = VB.zones[0]; p.tx = z.x + z.w / 2 - p.c[0]; p.ty = z.y + z.h / 2 - p.c[1]; p.s = p.tiny ? 1 : TRAY_SCALE; setTransform(p); $('loose').appendChild(p.g); });
}

function drawHints() {
  const g = $('ghosts'); g.replaceChildren();
  $('silhouette').setAttribute('d', DATA.border);
  $('inset').setAttribute('d', DATA.inset);
  // Level 3 tints every community with the colour its pieces carry, so the player matches colour first and shape second.
  if (hintLevel >= 3) DATA.communities.forEach(c => { const t = el('path', { class: 'tint', d: c.d }); paint(t, c.ri); g.appendChild(t); });
  if (hintLevel >= 1) DATA.communities.forEach(c => g.appendChild(el('path', { class: 'ghost community', d: c.d })));
  if (hintLevel >= 2 && mode === 'provinces') DATA.provinces.forEach(c => g.appendChild(el('path', { class: 'ghost', d: c.d })));
  // Ceuta and Melilla are a few pixels wide, so their "border" at this level is a marker ring.
  if (hintLevel >= 2) (mode === 'provinces' ? DATA.provinces : DATA.communities).forEach(c => {
    const bw = c.bbox[1][0] - c.bbox[0][0], bh = c.bbox[1][1] - c.bbox[0][1];
    if (Math.min(bw, bh) < 14) g.appendChild(el('circle', { class: 'ghost marker', cx: c.c[0], cy: c.c[1], r: 14 }));
  });
  $('hint').textContent = HINTS[hintLevel];
}

function say(big, sub, tone) {
  const s = $('status');
  s.classList.toggle('empty', !big);
  s.classList.toggle('good', tone === 'good'); s.classList.toggle('warn', tone === 'warn');
  $('sBig').textContent = big || ''; $('sSub').textContent = sub || '';
}

/* ---- dragging ---- */
let drag = null;
function svgPoint(e) { const pt = new DOMPoint(e.clientX, e.clientY); return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function onDown(e, p) {
  if (p.locked || done) return;
  e.preventDefault();
  if (!t0) startTimer();
  const pt = svgPoint(e);
  // Grow to full size while keeping the grabbed point under the pointer.
  const [cx, cy] = p.c, s = p.s;
  const ox = p.tx + cx - s * cx, oy = p.ty + cy - s * cy;          // current translation
  const lx = (pt.x - ox) / s, ly = (pt.y - oy) / s;                 // local point grabbed
  p.s = 1; p.tx = pt.x - lx; p.ty = pt.y - ly;
  drag = { p, lx, ly, id: e.pointerId };
  p.g.classList.add('dragging'); $('loose').appendChild(p.g);
  setTransform(p);
  p.g.setPointerCapture(e.pointerId);
  say(p.name, mode === 'provinces' ? short(p.region) : '', '');
}
svg.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const pt = svgPoint(e), p = drag.p;
  p.tx = pt.x - drag.lx; p.ty = pt.y - drag.ly;
  setTransform(p);
  if (p.tiny) warm(p, Math.hypot(p.tx, p.ty) <= p.tol * 2.5);
});
// For tiny pieces a ring lights up at the target once the piece is close, so the last centimetre is not guesswork.
let warmRing = null;
function warm(p, on) {
  if (on && !warmRing) { warmRing = el('circle', { class: 'warm', cx: p.c[0], cy: p.c[1], r: p.tol }); $('fx').appendChild(warmRing); }
  else if (!on && warmRing) { warmRing.remove(); warmRing = null; }
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const p = drag.p; drag = null;
  p.g.classList.remove('dragging'); warm(p, false);
  const dist = Math.hypot(p.tx, p.ty);
  if (dist <= p.tol) lock(p);
  else if (dist <= p.tol * 3) { misses++; p.g.classList.remove('miss'); void p.g.offsetWidth; p.g.classList.add('miss'); say('Casi', `${p.name} está un poco desplazada. Ajústala.`, 'warn'); }
  else if (insideMap(p)) { misses++; say('Ahí no', `${p.name} va en otra parte del mapa.`, 'warn'); }
}
svg.addEventListener('pointerup', onUp); svg.addEventListener('pointercancel', onUp);
function insideMap(p) { const x = p.c[0] + p.tx, y = p.c[1] + p.ty; return x > 0 && x < W && y > 0 && y < H; }

function lock(p) {
  p.locked = true; p.tx = 0; p.ty = 0; p.s = 1; setTransform(p);
  p.g.classList.add('locked');
  setTimeout(() => $('locked').appendChild(p.g), 190);
  // pulse ring
  const ring = el('circle', { class: 'ring', cx: p.c[0], cy: p.c[1], r: Math.max(18, Math.min(p.bw, p.bh) * 0.6) });
  ring.style.transformOrigin = `${p.c[0]}px ${p.c[1]}px`;
  $('fx').appendChild(ring); requestAnimationFrame(() => ring.classList.add('go')); setTimeout(() => ring.remove(), 700);
  placed++; $('placed').textContent = placed;
  say(`${p.name.split('/')[0]} ✓`, mode === 'provinces' ? short(p.region) : `Quedan ${pieces.length - placed}`, 'good');
  if (placed === pieces.length) finish();
}

/* ---- timer & finish ---- */
const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function startTimer() { t0 = Date.now(); timer = setInterval(() => $('time').textContent = fmt(Math.floor((Date.now() - t0) / 1000)), 500); }
function stopTimer() { clearInterval(timer); timer = null; t0 = null; }
function finish() {
  done = true; const secs = Math.floor((Date.now() - t0) / 1000); stopTimer(); $('time').textContent = fmt(secs);
  let best = null; try { const k = 'spp.best.' + mode; best = +localStorage.getItem(k) || null; if (!best || secs < best) { localStorage.setItem(k, secs); best = secs; } } catch (e) {}
  const what = mode === 'provinces' ? 'provincias' : 'comunidades';
  $('dTitle').textContent = `Las ${pieces.length} ${what}, colocadas`;
  $('dText').textContent = `${fmt(secs)} con ${misses} ${misses === 1 ? 'fallo' : 'fallos'}.` + (best ? ` Mejor tiempo: ${fmt(best)}.` : '');
  $('switch').textContent = mode === 'provinces' ? 'Probar comunidades' : 'Probar provincias';
  $('done').classList.add('show');
  say('', '', '');
}

/* ---- controls ---- */
function setMode(m) { mode = m; try { localStorage.setItem('spp.mode', m); } catch (e) {}
  $('modeP').setAttribute('aria-pressed', m === 'provinces'); $('modeC').setAttribute('aria-pressed', m === 'communities'); build(); }
$('modeP').onclick = () => setMode('provinces');
$('modeC').onclick = () => setMode('communities');
$('hint').onclick = () => { hintLevel = (hintLevel + 1) % 4; try { localStorage.setItem('spp.hint', hintLevel); } catch (e) {} drawHints(); };
$('shuffle').onclick = () => scatter();
// Fullscreen: hides the browser chrome where the Fullscreen API is available (iPad Safari included).
const root = document.documentElement;
const fsReq = root.requestFullscreen || root.webkitRequestFullscreen;
const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (fsReq && !standalone) {
  $('full').hidden = false;
  $('full').onclick = () => {
    const active = document.fullscreenElement || document.webkitFullscreenElement;
    if (active) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else fsReq.call(root);
  };
  const sync = () => { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); $('full').textContent = on ? 'Salir de pantalla completa' : 'Pantalla completa'; layout(); };
  document.addEventListener('fullscreenchange', sync); document.addEventListener('webkitfullscreenchange', sync);
}
$('again').onclick = () => build();
$('switch').onclick = () => setMode(mode === 'provinces' ? 'communities' : 'provinces');
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { const was = VB && VB.portrait; layout(); if (VB.portrait !== was) scatter(); }, 150); });
$('modeP').setAttribute('aria-pressed', mode === 'provinces'); $('modeC').setAttribute('aria-pressed', mode === 'communities');
build();
})();
</script>
</body>
</html>
